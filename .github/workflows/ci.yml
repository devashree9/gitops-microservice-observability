name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Automated Unit Tests
        working-directory: app
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ secrets.DOCKERHUB_USERNAME }}/gitops-microservice:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gitops-microservice:latest
            ${{ steps.meta.outputs.image_tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # This job only runs if deploy secrets are configured. Without a real
    # target host, CI/CD here stops at "image published to Docker Hub" —
    # which is an intentional, documented boundary rather than a broken step.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy to target host over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ needs.build.outputs.image_tag }}
            docker compose -f /opt/gitops/docker-compose.yml pull app
            docker compose -f /opt/gitops/docker-compose.yml up -d
            curl -f http://localhost:8000/ || exit 1
